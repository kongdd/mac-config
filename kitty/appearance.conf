# Appearance mapped from kong-wezterm appearance.lua
# https://github.com/kongdd/kong-wezterm/blob/master/appearance.lua

# Warp Light: light_theme(), LIGHT_MODE_NORMAL_COLORS / BRIGHT_COLORS
# https://github.com/warpdotdev/warp/blob/master/app/src/themes/default_themes.rs
foreground              #111111
background              #ffffff
selection_foreground    #111111
selection_background    #00c2ff
url_color               #008ec4
cursor                  #111111
cursor_text_color       #ffffff

color0                  #212121
color1                  #c30771
color2                  #10a778
color3                  #a89c14
color4                  #008ec4
color5                  #523c79
color6                  #20a5ba
color7                  #e0e0e0
color8                  #212121
color9                  #fb007a
color10                 #5fd7af
color11                 #f3e430
color12                 #20bbfc
color13                 #6855de
color14                 #4fb8cc
color15                 #f1f1f1

# Warp Light uses a solid white background (no gradient image).
background_image        none
background_opacity      1.0

# BlinkingBar, ease Constant, rate 700ms
cursor_shape            beam
cursor_shape_unfocused  hollow
cursor_blink_interval   0.7
cursor_stop_blinking_after 0

# enable_scroll_bar / min_scroll_bar_height = 3cell
scrollbar               always
scrollbar_min_handle_height 3

# hide_tab_bar_if_only_one_tab = false
# tab_max_width = 25
# switch_to_last_active_tab_when_closing_tab = true
tab_bar_edge            top
# tab_bar_min_tabs        1
tab_bar_style           separator
tab_separator           " │ "
tab_title_template      "{title:<14}"
# tab_powerline_style     angled
# tab_title_max_length    25
# tab_switch_strategy     previous
# Kitty UI colors adapted to Warp Light's background and accent.
tab_bar_background      #ffffff
tab_bar_margin_color    #ffffff
active_tab_foreground   #111111
active_tab_background   #00c2ff
active_tab_font_style   bold
inactive_tab_foreground #111111
inactive_tab_background #e0e0e0
inactive_tab_font_style normal

# window_frame titlebar
macos_titlebar_color    #ffffff
hide_window_decorations no

# initial_cols / initial_rows; padding is points: top right bottom left
remember_window_size    no
initial_window_width    90c
initial_window_height   24c
window_padding_width    12 10 7 5

# 关闭标签页/窗口时不弹出确认
confirm_os_window_close 0

# window_frame.font_size
font_size               15.0
modify_font cell_height 110%
