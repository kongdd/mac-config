# On K380, physical Ctrl is Command: keep terminal Ctrl+L / Ctrl+D behavior.
map cmd+l send_text all \x0c
map cmd+d send_text all \x04
map cmd+v paste_from_clipboard
map ctrl+v send_key ctrl+v

# 将 Cmd+E 传给 Yazi。
map cmd+e

# Command + 左/右：发送 Ctrl+A / Ctrl+E，跳到 Shell 命令行首/尾。
map cmd+left send_text all \x01
map cmd+right send_text all \x05

# Ctrl + 右/下：向右/下分屏，沿用当前目录。
map ctrl+right combine : goto_layout splits : launch --location=vsplit --cwd=current
map ctrl+down combine : goto_layout splits : launch --location=hsplit --cwd=current
